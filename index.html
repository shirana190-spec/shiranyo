<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>שירן קייקס - ניהול הזמנות</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getAuth, signInWithRedirect, getRedirectResult, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAY2rawG2ChvPoC7zZyITFl0KEew8xddSQ",
            authDomain: "shiran-cakes.firebaseapp.com",
            projectId: "shiran-cakes",
            storageBucket: "shiran-cakes.firebasestorage.app",
            messagingSenderId: "838335385748",
            appId: "1:838335385748:web:ee2af1554ae38900d3e481"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();
        const appId = 'shiran-cakes-v1';

        // Handling Redirect result for mobile
        getRedirectResult(auth).catch(err => console.error(err));

        onAuthStateChanged(auth, (user) => {
            const loader = document.getElementById('global-loader');
            const loginScreen = document.getElementById('login-screen');
            const mainApp = document.getElementById('main-app');
            
            if (user) {
                document.getElementById('user-name').innerText = "היי " + user.displayName.split(' ')[0];
                listenToOrders(user.uid);
                loader.classList.add('hidden');
                loginScreen.classList.add('hidden');
                mainApp.classList.remove('hidden');
            } else {
                loader.classList.add('hidden');
                loginScreen.classList.remove('hidden');
                mainApp.classList.add('hidden');
            }
        });

        window.login = () => signInWithRedirect(auth, provider);
        window.logout = () => signOut(auth);

        function listenToOrders(uid) {
            const q = collection(db, 'artifacts', appId, 'users', uid, 'orders');
            onSnapshot(q, (snapshot) => {
                const orders = snapshot.docs.map(doc => ({ ...doc.data(), id: doc.id }));
                render(orders);
            });
        }

        window.saveOrder = async (data) => {
            const user = auth.currentUser;
            if (!user) { alert("חייב להתחבר קודם"); return; }
            const ref = doc(db, 'artifacts', appId, 'users', user.uid, 'orders', data.id);
            await setDoc(ref, data);
        };

        window.deleteOrder = async (id) => {
            if (confirm("למחוק?")) {
                const user = auth.currentUser;
                await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'orders', id));
            }
        };

        // Smart Parsing for Shiran's specific message format
        window.analyzePaste = (text) => {
            // Try to find name (usually the first word or after "שם:")
            const nameMatch = text.match(/(?:שם|לקוחה?)[:\s-]\s*([א-ת\s]+)/) || text.match(/^([א-ת]+)\s*:/);
            const dateMatch = text.match(/(\d{1,2}[\/.]\d{1,2}[\/.]\d{2,4})/);
            
            if (nameMatch) document.getElementById('cust-name').value = nameMatch[1].trim();
            if (dateMatch) {
                const parts = dateMatch[1].split(/[\/.]/);
                if (parts[2]?.length === 2) parts[2] = "20" + parts[2];
                document.getElementById('cust-date').value = `${parts[2]}-${parts[1].padStart(2,'0')}-${parts[0].padStart(2,'0')}`;
            }
            document.getElementById('cust-desc').value = text;
        };

        window.handleImageUpload = (event) => {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                window.currentImageData = e.target.result;
                document.getElementById('img-preview').src = e.target.result;
                document.getElementById('img-preview-container').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        };
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap');
        body { font-family: 'Assistant', sans-serif; background: #fff5f7; }
        .allergy-alert { color: #dc2626; font-weight: 800; background: #fee2e2; padding: 2px 6px; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen pb-24">

    <div id="global-loader" class="fixed inset-0 bg-white z-[200] flex flex-col items-center justify-center">
        <div class="w-12 h-12 border-4 border-pink-500 border-t-transparent rounded-full animate-spin"></div>
    </div>

    <!-- Login -->
    <div id="login-screen" class="hidden flex flex-col items-center justify-center min-h-screen p-6">
        <div class="bg-white p-8 rounded-[2.5rem] shadow-xl text-center w-full max-w-xs">
            <div class="text-5xl mb-4">🧁</div>
            <h1 class="text-2xl font-bold mb-6">שירן קייקס</h1>
            <button onclick="login()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold flex items-center justify-center gap-2">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google/lightweight/icon-google.svg" class="w-5">
                כניסה למערכת
            </button>
        </div>
    </div>

    <!-- Main -->
    <div id="main-app" class="hidden">
        <header class="bg-white/80 backdrop-blur-md p-4 sticky top-0 z-40 border-b border-pink-100 flex justify-between items-center">
            <span id="user-name" class="font-bold text-pink-600"></span>
            <button onclick="logout()" class="text-slate-300"><i data-lucide="log-out" class="w-5 h-5"></i></button>
        </header>

        <main class="p-4 space-y-4 max-w-md mx-auto" id="orders-list"></main>

        <button onclick="openModal()" class="fixed bottom-6 left-1/2 -translate-x-1/2 w-16 h-16 bg-pink-500 text-white rounded-full shadow-lg flex items-center justify-center z-50 border-4 border-white">
            <i data-lucide="plus" class="w-8 h-8"></i>
        </button>
    </div>

    <!-- New Order Modal -->
    <div id="modal" class="fixed inset-0 bg-black/50 z-[100] hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-[2rem] overflow-hidden flex flex-col max-h-[90vh]">
            <div class="p-5 bg-pink-50 flex justify-between items-center border-b">
                <h2 class="font-bold text-pink-700">הזמנה חדשה ✨</h2>
                <button onclick="closeModal()"><i data-lucide="x" class="text-pink-300"></i></button>
            </div>
            <div class="p-5 overflow-y-auto space-y-4">
                <textarea oninput="analyzePaste(this.value)" placeholder="הדביקי הודעת וואטסאפ כאן..." class="w-full p-3 bg-blue-50 border border-blue-100 rounded-xl text-sm h-20 outline-none"></textarea>
                
                <input type="text" id="cust-name" placeholder="שם הלקוחה" class="w-full p-4 bg-slate-50 rounded-xl outline-none border border-transparent focus:border-pink-200">
                
                <div class="grid grid-cols-2 gap-2">
                    <input type="date" id="cust-date" class="p-4 bg-slate-50 rounded-xl outline-none">
                    <select id="cust-time" class="p-4 bg-slate-50 rounded-xl outline-none">
                        <option value="בוקר">☀️ בוקר</option>
                        <option value="צהריים">🌤️ צהריים</option>
                        <option value="ערב">🌙 ערב</option>
                    </select>
                </div>

                <textarea id="cust-desc" placeholder="פירוט ההזמנה..." class="w-full p-4 bg-slate-50 rounded-xl h-32 outline-none"></textarea>

                <label class="flex items-center justify-center gap-2 p-4 bg-pink-50 border-2 border-dashed border-pink-200 rounded-xl text-pink-500 cursor-pointer">
                    <i data-lucide="camera" class="w-5 h-5"></i>
                    <span class="font-bold text-sm">הוספת תמונה מהגלריה</span>
                    <input type="file" accept="image/*" onchange="handleImageUpload(event)" class="hidden">
                </label>
                <div id="img-preview-container" class="hidden"><img id="img-preview" class="w-full h-32 object-cover rounded-xl"></div>

                <button onclick="handleNewOrder()" id="save-btn" class="w-full bg-pink-500 text-white py-4 rounded-xl font-bold">שמור הזמנה</button>
            </div>
        </div>
    </div>

    <script>
        function openModal() { document.getElementById('modal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('modal').classList.add('hidden'); }

        function render(orders) {
            const list = document.getElementById('orders-list');
            if (orders.length === 0) {
                list.innerHTML = '<p class="text-center py-20 text-slate-300">אין הזמנות כרגע...</p>';
                return;
            }

            const sorted = orders.sort((a,b) => new Date(a.date) - new Date(b.date));
            list.innerHTML = sorted.map(o => {
                // Highlight allergies in the description
                let detailsHtml = (o.details || '')
                    .replace(/(אלרגנים[:\s-].+)/g, '<span class="allergy-alert">$1</span>')
                    .replace(/\n/g, '<br>');

                return `
                <div class="bg-white rounded-3xl shadow-sm border border-pink-50 overflow-hidden">
                    ${o.image ? `<img src="${o.image}" class="w-full h-44 object-cover">` : ''}
                    <div class="p-5">
                        <div class="flex justify-between items-start mb-3">
                            <div>
                                <h3 class="font-bold text-lg text-slate-800">${o.name}</h3>
                                <div class="flex gap-2 items-center text-xs mt-1">
                                    <span class="bg-pink-100 text-pink-600 px-2 py-0.5 rounded-lg font-bold">${o.time}</span>
                                    <span class="text-slate-400">${o.date.split('-').reverse().join('/')}</span>
                                </div>
                            </div>
                            <button onclick="window.deleteOrder('${o.id}')" class="text-slate-200"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                        <div class="text-sm text-slate-600 leading-relaxed">${detailsHtml}</div>
                    </div>
                </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        async function handleNewOrder() {
            const btn = document.getElementById('save-btn');
            btn.disabled = true; btn.innerText = 'שומר...';
            
            const data = {
                id: Date.now().toString(),
                name: document.getElementById('cust-name').value || 'ללא שם',
                date: document.getElementById('cust-date').value,
                time: document.getElementById('cust-time').value,
                details: document.getElementById('cust-desc').value,
                image: window.currentImageData || null
            };
            
            try {
                await window.saveOrder(data);
                closeModal();
                document.getElementById('cust-name').value = '';
                document.getElementById('cust-desc').value = '';
                window.currentImageData = null;
                document.getElementById('img-preview-container').classList.add('hidden');
            } catch (e) { alert("שגיאה בשמירה: " + e.message); }
            finally { btn.disabled = false; btn.innerText = 'שמור הזמנה'; }
        }
        lucide.createIcons();
    </script>
</body>
</html>

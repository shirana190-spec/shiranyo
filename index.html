<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ניהול הזמנות - שירן</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

        const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'shiran-cakes-sync';
        
        let db, auth, currentUser;

        // אתחול המערכת
        if (firebaseConfig.apiKey) {
            const app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            
            // הגדרת זיכרון מקומי - שומר את המשתמש מחובר
            setPersistence(auth, browserLocalPersistence).catch(err => console.error("Persistence error", err));
        }

        // פונקציית התחברות
        window.login = async () => {
            const provider = new GoogleAuthProvider();
            try {
                document.getElementById('global-loader').classList.remove('hidden');
                await signInWithPopup(auth, provider);
            } catch (e) {
                console.error("Login failed", e);
                document.getElementById('global-loader').classList.add('hidden');
                alert("התחברות נכשלה. נסי שוב.");
            }
        };

        window.logout = () => {
            if(confirm("להתנתק מהחשבון?")) {
                signOut(auth);
            }
        };

        // האזנה למצב המשתמש - כאן קורה הקסם של הזיכרון
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            const loginScreen = document.getElementById('login-screen');
            const mainApp = document.getElementById('main-app');
            const loader = document.getElementById('global-loader');
            
            if (user) {
                // המשתמש מחובר (או שגוגל זכר אותו)
                document.getElementById('user-name').innerText = user.displayName;
                listenToOrders(); // מתחיל לטעון נתונים
                
                // הסתרת טעינה והצגת אפליקציה
                loader.classList.add('hidden');
                loginScreen.classList.add('hidden');
                mainApp.classList.remove('hidden');
            } else {
                // המשתמש לא מחובר
                loader.classList.add('hidden');
                loginScreen.classList.remove('hidden');
                mainApp.classList.add('hidden');
            }
        });

        function listenToOrders() {
            if (!currentUser) return;
            const q = collection(db, 'artifacts', appId, 'users', currentUser.uid, 'orders');
            
            // האזנה חיה לנתונים
            onSnapshot(q, (snapshot) => {
                window.orders = snapshot.docs.map(doc => ({ ...doc.data(), id: doc.id }));
                render();
            }, (error) => {
                console.error("Sync error", error);
                // אם יש שגיאת הרשאות, כנראה צריך להתחבר מחדש
            });
        }

        window.saveOrderToCloud = async (data) => {
            if (!currentUser) return;
            try {
                const ref = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'orders', data.id);
                await setDoc(ref, { ...data, lastUpdated: Date.now() });
            } catch (e) {
                console.error("Save error", e);
                alert("שגיאה בשמירה לענן");
            }
        };

        window.deleteFromCloud = async (id) => {
            if (!currentUser) return;
            const ref = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'orders', id);
            await deleteDoc(ref);
        };
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700&display=swap');
        body { font-family: 'Assistant', sans-serif; -webkit-tap-highlight-color: transparent; }
        .loader-spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .modal-animate { animation: slideUp 0.2s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <!-- מסך טעינה גלובלי - מופיע בזמן שהמערכת בודקת מי את -->
    <div id="global-loader" class="fixed inset-0 bg-white z-[110] flex flex-col items-center justify-center">
        <div class="relative w-20 h-20">
            <div class="absolute inset-0 border-4 border-pink-100 rounded-full"></div>
            <div class="absolute inset-0 border-4 border-pink-500 rounded-full border-t-transparent loader-spin"></div>
        </div>
        <p class="mt-4 text-slate-500 font-bold animate-pulse">מתחבר לענן של שירן...</p>
    </div>

    <!-- מסך התחברות -->
    <div id="login-screen" class="fixed inset-0 bg-white z-[100] flex flex-col items-center justify-center p-6 text-center hidden">
        <div class="w-24 h-24 bg-pink-100 rounded-full flex items-center justify-center text-pink-600 mb-6 shadow-inner">
            <i data-lucide="cake" class="w-12 h-12"></i>
        </div>
        <h1 class="text-3xl font-bold text-slate-800 mb-2">ניהול הזמנות</h1>
        <p class="text-slate-500 mb-8 max-w-xs text-sm">התחברי פעם אחת כדי שכל ההזמנות יישמרו לך בענן של גוגל.</p>
        <button onclick="login()" class="flex items-center gap-3 bg-white border border-slate-300 px-8 py-4 rounded-2xl font-bold shadow-md active:scale-95 transition-all">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google/lightweight/icon-google.svg" class="w-6 h-6">
            התחברי עם Google
        </button>
    </div>

    <!-- האפליקציה הראשית -->
    <div id="main-app" class="hidden">
        <header class="bg-pink-600 text-white p-4 shadow-lg sticky top-0 z-40 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <button onclick="logout()" class="w-9 h-9 rounded-full bg-white/20 flex items-center justify-center border border-white/30">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                </button>
                <div>
                    <h1 class="text-sm font-bold leading-tight" id="user-name">טוען...</h1>
                    <div class="flex items-center gap-1">
                        <span class="w-1.5 h-1.5 bg-green-400 rounded-full"></span>
                        <span class="text-[9px] uppercase font-bold text-pink-100">סנכרון פעיל</span>
                    </div>
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="openModal('import')" class="p-2.5 bg-white/10 rounded-xl"><i data-lucide="wand-2" class="w-5 h-5"></i></button>
                <button onclick="openModal('form')" class="p-2.5 bg-white rounded-xl text-pink-600 shadow-md"><i data-lucide="plus" class="w-6 h-6"></i></button>
            </div>
        </header>

        <main id="orders-list" class="p-4 max-w-xl mx-auto space-y-4 pb-24"></main>
    </div>

    <!-- מודאל (טופס) -->
    <div id="modal-overlay" class="fixed inset-0 bg-black/60 z-50 hidden flex items-end sm:items-center justify-center backdrop-blur-sm">
        <div class="bg-white w-full max-w-lg rounded-t-[2.5rem] sm:rounded-3xl overflow-hidden modal-animate">
            <div class="p-6 max-h-[90vh] overflow-y-auto text-right">
                <div id="view-import" class="space-y-4">
                    <div class="flex justify-between items-center">
                        <h2 class="font-bold text-xl">ייבוא מהודעה</h2>
                        <button onclick="closeModal()" class="text-slate-400"><i data-lucide="x"></i></button>
                    </div>
                    <textarea id="import-text" class="w-full h-48 p-4 bg-slate-50 border border-slate-100 rounded-2xl text-sm outline-none" placeholder="הדביקי את סיכום ההזמנה כאן..."></textarea>
                    <button onclick="processImport()" class="w-full bg-pink-600 text-white py-4 rounded-2xl font-bold shadow-lg">חלצי נתונים</button>
                </div>

                <form id="order-form" onsubmit="handleSubmit(event)" class="hidden space-y-4">
                    <div class="flex justify-between items-center mb-2">
                        <h2 class="font-bold text-xl" id="form-title">הזמנה חדשה</h2>
                        <button type="button" onclick="closeModal()" class="text-slate-400"><i data-lucide="x"></i></button>
                    </div>
                    <div id="img-slots" class="grid grid-cols-3 gap-3 mb-2"></div>
                    <div class="space-y-3">
                        <input type="text" id="f-name" placeholder="שם הלקוחה" required class="w-full p-4 bg-slate-50 border-0 rounded-2xl outline-none font-bold">
                        <div class="grid grid-cols-2 gap-3">
                            <input type="date" id="f-date" required class="w-full p-4 bg-slate-50 border-0 rounded-2xl outline-none">
                            <input type="number" id="f-price" placeholder="מחיר" class="w-full p-4 bg-slate-50 border-0 rounded-2xl outline-none font-bold">
                        </div>
                        <select id="f-time" class="w-full p-4 bg-slate-50 border-0 rounded-2xl outline-none">
                            <option value="בוקר">בוקר</option><option value="צהריים">צהריים</option><option value="ערב">ערב</option>
                        </select>
                        <textarea id="f-details" rows="3" placeholder="פירוט..." class="w-full p-4 bg-slate-50 border-0 rounded-2xl outline-none"></textarea>
                        <input type="text" id="f-notes" placeholder="הערות דחופות/אלרגיות" class="w-full p-4 bg-red-50 border-0 rounded-2xl outline-none text-red-700 font-bold">
                    </div>
                    <button type="submit" id="save-btn" class="w-full bg-pink-600 text-white py-4 rounded-2xl font-bold shadow-lg mt-4">שמירה לענן</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        window.orders = [];
        let currentImages = [];
        let currentEditId = null;

        function render() {
            const container = document.getElementById('orders-list');
            if (!window.orders || window.orders.length === 0) {
                container.innerHTML = `<div class="text-center py-20 text-slate-300"><i data-lucide="cake" class="w-12 h-12 mx-auto mb-2 opacity-10"></i><p>אין הזמנות כרגע</p></div>`;
            } else {
                const sorted = [...window.orders].sort((a, b) => new Date(a.date) - new Date(b.date));
                container.innerHTML = sorted.map(o => `
                    <div class="bg-white rounded-[2rem] shadow-sm border border-slate-100 overflow-hidden" onclick="toggleDetails('${o.id}')">
                        <div class="p-5 flex items-center justify-between">
                            <div class="flex items-center gap-4">
                                <div class="w-14 h-14 bg-pink-50 rounded-2xl flex items-center justify-center overflow-hidden border border-pink-100">
                                    ${o.images && o.images[0] ? `<img src="${o.images[0]}" class="w-full h-full object-cover">` : `<i data-lucide="cake" class="w-6 h-6 text-pink-200"></i>`}
                                </div>
                                <div class="text-right">
                                    <h3 class="font-bold text-slate-800 text-lg leading-tight">${o.name}</h3>
                                    <p class="text-xs text-pink-500 font-bold mt-0.5">${o.date.split('-').reverse().join('/')} • ${o.time}</p>
                                </div>
                            </div>
                            <div class="bg-slate-50 px-3 py-1 rounded-full font-bold text-slate-700 text-sm">₪${o.price || 0}</div>
                        </div>
                        <div id="details-${o.id}" class="hidden px-5 pb-5 space-y-4 border-t border-slate-50 pt-4 bg-slate-50/30 text-right">
                            ${o.images && o.images.length > 0 ? `
                                <div class="flex gap-2 overflow-x-auto pb-2">
                                    ${o.images.map(img => `<img src="${img}" class="h-28 w-28 object-cover rounded-2xl border-2 border-white shadow-sm" onclick="event.stopPropagation(); window.open('${img}')">`).join('')}
                                </div>
                            ` : ''}
                            ${o.notes ? `<div class="bg-red-50 p-3 rounded-xl text-red-700 text-xs font-bold border border-red-100">${o.notes}</div>` : ''}
                            <div class="text-sm text-slate-600 bg-white p-4 rounded-2xl shadow-inner whitespace-pre-wrap leading-relaxed">${o.details || 'אין פירוט נוסף'}</div>
                            <div class="flex gap-2">
                                <button onclick="event.stopPropagation(); editOrder('${o.id}')" class="flex-1 py-3 bg-slate-800 text-white rounded-xl text-xs font-bold">עריכה</button>
                                <button onclick="event.stopPropagation(); deleteOrder('${o.id}')" class="px-5 py-3 text-red-500 bg-red-50 rounded-xl"><i data-lucide="trash-2" class="w-5 h-5"></i></button>
                            </div>
                        </div>
                    </div>
                `).join('');
            }
            lucide.createIcons();
        }

        window.toggleDetails = (id) => {
            const el = document.getElementById(`details-${id}`);
            const isHidden = el.classList.contains('hidden');
            document.querySelectorAll('[id^="details-"]').forEach(d => d.classList.add('hidden'));
            if (isHidden) el.classList.remove('hidden');
        };

        window.closeModal = () => { document.getElementById('modal-overlay').classList.add('hidden'); currentImages = []; currentEditId = null; };

        window.openModal = (mode) => {
            document.getElementById('modal-overlay').classList.remove('hidden');
            if (mode === 'import') {
                document.getElementById('view-import').classList.remove('hidden');
                document.getElementById('order-form').classList.add('hidden');
            } else {
                document.getElementById('view-import').classList.add('hidden');
                document.getElementById('order-form').classList.remove('hidden');
                document.getElementById('form-title').innerText = currentEditId ? "עריכת הזמנה" : "הזמנה חדשה";
                refreshImageSlots();
            }
        };

        window.refreshImageSlots = () => {
            const container = document.getElementById('img-slots');
            container.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                const div = document.createElement('div');
                div.className = "relative aspect-square bg-slate-50 border-2 border-dashed border-slate-200 rounded-2xl flex items-center justify-center overflow-hidden";
                if (currentImages[i]) {
                    div.innerHTML = `<img src="${currentImages[i]}" class="w-full h-full object-cover">
                                     <button onclick="currentImages.splice(${i},1); refreshImageSlots()" class="absolute top-1 right-1 bg-red-500 text-white p-1 rounded-full shadow-lg"><i data-lucide="x" class="w-3 h-3"></i></button>`;
                } else {
                    div.innerHTML = `<label class="w-full h-full flex flex-col items-center justify-center cursor-pointer">
                                        <i data-lucide="camera" class="text-slate-300 w-6 h-6"></i>
                                        <input type="file" accept="image/*" class="hidden" onchange="const r = new FileReader(); r.onload=(e)=>{currentImages.push(e.target.result); refreshImageSlots()}; r.readAsDataURL(this.files[0])">
                                     </label>`;
                }
                container.appendChild(div);
            }
            lucide.createIcons();
        };

        window.handleSubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('save-btn');
            btn.disabled = true; btn.innerHTML = "שומר...";

            const data = {
                id: currentEditId || Date.now().toString(),
                name: document.getElementById('f-name').value,
                date: document.getElementById('f-date').value,
                price: document.getElementById('f-price').value,
                time: document.getElementById('f-time').value,
                details: document.getElementById('f-details').value,
                notes: document.getElementById('f-notes').value,
                images: currentImages
            };

            await window.saveOrderToCloud(data);
            closeModal();
            btn.disabled = false; btn.innerText = "שמירה לענן";
        };

        window.editOrder = (id) => {
            const o = window.orders.find(x => x.id === id);
            currentEditId = id;
            document.getElementById('f-name').value = o.name;
            document.getElementById('f-date').value = o.date;
            document.getElementById('f-price').value = o.price;
            document.getElementById('f-time').value = o.time;
            document.getElementById('f-details').value = o.details;
            document.getElementById('f-notes').value = o.notes;
            currentImages = o.images || [];
            openModal('form');
        };

        window.deleteOrder = async (id) => {
            if (confirm("למחוק?")) await window.deleteFromCloud(id);
        };

        window.processImport = () => {
            const t = document.getElementById('import-text').value;
            if(!t) return;
            const name = t.split('\n')[0].split(':')[0].replace(/[🎂*]/g, '').trim();
            const price = t.match(/(\d+)/)?.[0] || "";
            document.getElementById('f-name').value = name;
            document.getElementById('f-price').value = price;
            document.getElementById('f-details').value = t;
            openModal('form');
        };

        lucide.createIcons();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ניהול הזמנות - שירן</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

        // הפרטים שלך מה-Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAY2rawG2ChvPoC7zZyITFl0KEew8xddSQ",
            authDomain: "shiran-cakes.firebaseapp.com",
            projectId: "shiran-cakes",
            storageBucket: "shiran-cakes.firebasestorage.app",
            messagingSenderId: "838335385748",
            appId: "1:838335385748:web:ee2af1554ae38900d3e481"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'shiran-cakes-v1';

        onAuthStateChanged(auth, (user) => {
            const loader = document.getElementById('global-loader');
            const loginScreen = document.getElementById('login-screen');
            const mainApp = document.getElementById('main-app');
            
            if (user) {
                document.getElementById('user-name').innerText = "שלום, " + user.displayName;
                listenToOrders(user.uid);
                loader.classList.add('hidden');
                loginScreen.classList.add('hidden');
                mainApp.classList.remove('hidden');
            } else {
                loader.classList.add('hidden');
                loginScreen.classList.remove('hidden');
                mainApp.classList.add('hidden');
            }
        });

        window.login = async () => {
            const provider = new GoogleAuthProvider();
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error("Login failed", error);
                alert("התחברות נכשלה. ודאי ששמרת את הגדרות ה-Google Login ב-Firebase");
            }
        };

        window.logout = () => { if(confirm("להתנתק מהמערכת?")) signOut(auth); };

        function listenToOrders(uid) {
            const q = collection(db, 'artifacts', appId, 'users', uid, 'orders');
            onSnapshot(q, (snapshot) => {
                const orders = snapshot.docs.map(doc => ({ ...doc.data(), id: doc.id }));
                render(orders);
            }, (error) => {
                console.error("Snapshot error", error);
            });
        }

        window.saveOrder = async (data) => {
            if (!auth.currentUser) return;
            const ref = doc(db, 'artifacts', appId, 'users', auth.currentUser.uid, 'orders', data.id);
            await setDoc(ref, data);
        };

        window.deleteOrder = async (id) => {
            if (confirm("למחוק את ההזמנה הזו?")) {
                await deleteDoc(doc(db, 'artifacts', appId, 'users', auth.currentUser.uid, 'orders', id));
            }
        };
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@400;700&display=swap');
        body { font-family: 'Assistant', sans-serif; overflow-x: hidden; }
        .bg-gradient { background: linear-gradient(135deg, #fdf2f8 0%, #fce7f3 100%); }
    </style>
</head>
<body class="bg-gradient min-h-screen pb-20">

    <div id="global-loader" class="fixed inset-0 bg-white z-[200] flex flex-col items-center justify-center text-pink-500 font-bold">
        <div class="w-12 h-12 border-4 border-pink-200 border-t-pink-500 rounded-full animate-spin mb-4"></div>
        טוען את המערכת...
    </div>

    <div id="login-screen" class="hidden flex flex-col items-center justify-center min-h-screen p-6">
        <div class="bg-white/80 backdrop-blur-sm p-8 rounded-[2rem] shadow-2xl flex flex-col items-center max-w-sm w-full border border-white">
            <div class="text-6xl mb-4">🧁</div>
            <h1 class="text-2xl font-bold text-pink-600 mb-2 text-center">עוגות שירן</h1>
            <p class="text-slate-500 mb-8 text-center text-sm">ניהול הזמנות חכם ופשוט</p>
            <button onclick="login()" class="w-full flex items-center justify-center gap-3 bg-white border border-slate-200 py-4 rounded-2xl font-bold shadow-sm hover:shadow-md active:scale-95 transition-all">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google/lightweight/icon-google.svg" class="w-6 h-6">
                כניסה עם גוגל
            </button>
        </div>
    </div>

    <div id="main-app" class="hidden">
        <header class="bg-white/70 backdrop-blur-md p-4 sticky top-0 z-50 flex justify-between items-center border-b border-pink-100">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-pink-500 rounded-full flex items-center justify-center text-white text-xs font-bold">ש</div>
                <span id="user-name" class="font-bold text-slate-800 text-sm"></span>
            </div>
            <button onclick="logout()" class="text-slate-400 p-2"><i data-lucide="log-out" class="w-5 h-5"></i></button>
        </header>

        <main class="p-4 max-w-lg mx-auto">
            <div id="orders-list" class="space-y-4"></div>
        </main>

        <div class="fixed bottom-0 left-0 right-0 p-6 flex justify-center pointer-events-none">
            <button onclick="document.getElementById('modal').classList.remove('hidden')" class="w-16 h-16 bg-pink-500 text-white rounded-full shadow-lg flex items-center justify-center text-3xl font-bold active:scale-90 transition-all pointer-events-auto border-4 border-white">
                <i data-lucide="plus"></i>
            </button>
        </div>
    </div>

    <!-- מודאל הוספה -->
    <div id="modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-[100] hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-[2.5rem] p-8 shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-slate-800">הזמנה חדשה</h2>
                <button onclick="closeModal()" class="text-slate-300 hover:text-slate-500"><i data-lucide="x"></i></button>
            </div>
            <form onsubmit="event.preventDefault(); handleNewOrder();" class="space-y-4 text-right">
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1 mr-2">שם הלקוחה</label>
                    <input type="text" id="cust-name" placeholder="מי הזמינה?" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:border-pink-300 transition-all text-right" required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1 mr-2">תאריך איסוף</label>
                    <input type="date" id="cust-date" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:border-pink-300 transition-all text-right" required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1 mr-2">פרטי העוגה</label>
                    <textarea id="cust-desc" placeholder="סוג עוגה, הקדשה, הערות..." class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:border-pink-300 transition-all text-right" rows="4"></textarea>
                </div>
                <button type="submit" id="save-btn" class="w-full bg-pink-500 text-white py-4 rounded-2xl font-bold shadow-lg shadow-pink-200 active:scale-95 transition-all">שמור הזמנה</button>
            </form>
        </div>
    </div>

    <script>
        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        function render(orders) {
            const list = document.getElementById('orders-list');
            if (orders.length === 0) {
                list.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-20 text-slate-300">
                        <i data-lucide="calendar-heart" class="w-16 h-16 mb-4 opacity-20"></i>
                        <p class="font-bold">אין עדיין הזמנות</p>
                        <p class="text-xs">לחצי על הפלוס כדי להתחיל</p>
                    </div>`;
                lucide.createIcons();
                return;
            }
            
            // מיון לפי תאריך (הקרוב ביותר ראשון)
            list.innerHTML = orders.sort((a,b) => new Date(a.date) - new Date(b.date)).map(o => {
                const orderDate = new Date(o.date);
                const isToday = new Date().toDateString() === orderDate.toDateString();
                
                return `
                <div class="bg-white p-5 rounded-3xl shadow-sm border border-pink-50 text-right relative group">
                    <div class="flex justify-between items-start mb-2">
                        <button onclick="window.deleteOrder('${o.id}')" class="text-slate-200 hover:text-red-400 transition-colors">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                        <div class="flex flex-col items-end">
                            <div class="font-bold text-lg text-slate-800">${o.name}</div>
                            <div class="flex items-center gap-1 ${isToday ? 'text-green-500' : 'text-pink-500'} font-bold text-sm">
                                <span>${o.date.split('-').reverse().join('/')}</span>
                                <i data-lucide="calendar" class="w-3 h-3"></i>
                            </div>
                        </div>
                    </div>
                    <div class="bg-slate-50 p-3 rounded-2xl text-slate-600 text-sm whitespace-pre-wrap leading-relaxed">${o.details || 'אין פירוט'}</div>
                </div>
            `}).join('');
            lucide.createIcons();
        }

        async function handleNewOrder() {
            const btn = document.getElementById('save-btn');
            btn.disabled = true;
            btn.innerHTML = '<div class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin mx-auto"></div>';
            
            const data = {
                id: Date.now().toString(),
                name: document.getElementById('cust-name').value,
                date: document.getElementById('cust-date').value,
                details: document.getElementById('cust-desc').value,
                createdAt: new Date().toISOString()
            };
            
            try {
                await window.saveOrder(data);
                closeModal();
                document.querySelector('form').reset();
            } catch (e) {
                alert("שגיאה בשמירה. נסי שוב.");
            } finally {
                btn.disabled = false;
                btn.innerText = "שמור הזמנה";
            }
        }
        
        lucide.createIcons();
    </script>
</body>
</html>

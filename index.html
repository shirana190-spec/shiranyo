<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ניהול הזמנות שירן - הגרסה המלאה</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, query } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAY2rawG2ChvPoC7zZyITFl0KEew8xddSQ",
            authDomain: "shiran-cakes.firebaseapp.com",
            projectId: "shiran-cakes",
            storageBucket: "shiran-cakes.firebasestorage.app",
            messagingSenderId: "838335385748",
            appId: "1:838335385748:web:ee2af1554ae38900d3e481"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'shiran-cakes-v1';

        // State
        let currentUser = null;

        onAuthStateChanged(auth, (user) => {
            const loader = document.getElementById('global-loader');
            const loginScreen = document.getElementById('login-screen');
            const mainApp = document.getElementById('main-app');
            
            if (user) {
                currentUser = user;
                document.getElementById('user-name').innerText = "היי " + user.displayName.split(' ')[0] + " ✨";
                listenToOrders(user.uid);
                loader.classList.add('hidden');
                loginScreen.classList.add('hidden');
                mainApp.classList.remove('hidden');
            } else {
                currentUser = null;
                loader.classList.add('hidden');
                loginScreen.classList.remove('hidden');
                mainApp.classList.add('hidden');
            }
        });

        window.login = async () => {
            const provider = new GoogleAuthProvider();
            try { await signInWithPopup(auth, provider); } 
            catch (error) { document.getElementById('login-error').innerText = "שגיאה בהתחברות: " + error.message; }
        };

        window.logout = () => { if(confirm("להתנתק?")) signOut(auth); };

        function listenToOrders(uid) {
            const q = collection(db, 'artifacts', appId, 'users', uid, 'orders');
            onSnapshot(q, (snapshot) => {
                const orders = snapshot.docs.map(doc => ({ ...doc.data(), id: doc.id }));
                render(orders);
            }, (err) => console.error(err));
        }

        window.saveOrder = async (data) => {
            if (!currentUser) return;
            const ref = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'orders', data.id);
            await setDoc(ref, data);
        };

        window.deleteOrder = async (id) => {
            if (confirm("למחוק את ההזמנה?")) {
                await deleteDoc(doc(db, 'artifacts', appId, 'users', currentUser.uid, 'orders', id));
            }
        };

        // Smart Paste Logic
        window.analyzePaste = (text) => {
            const lines = text.split('\n');
            let name = "", date = "", details = text;

            // Simple heuristic analysis
            const nameMatch = text.match(/(?:שם|לקוח|עבור|לכבוד)[:\s-]\s*([א-ת\s]+)/);
            if (nameMatch) name = nameMatch[1].trim();

            const dateMatch = text.match(/(\d{1,2}[\/.]\d{1,2}[\/.]\d{2,4})/);
            if (dateMatch) {
                const parts = dateMatch[1].split(/[\/.]/);
                if (parts[2] && parts[2].length === 2) parts[2] = "20" + parts[2];
                date = `${parts[2]}-${parts[1].padStart(2,'0')}-${parts[0].padStart(2,'0')}`;
            }

            if (name) document.getElementById('cust-name').value = name;
            if (date) document.getElementById('cust-date').value = date;
            document.getElementById('cust-desc').value = details;
        };
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap');
        body { font-family: 'Assistant', sans-serif; }
        .pink-gradient { background: linear-gradient(135deg, #fff5f7 0%, #ffe4e6 100%); }
        .order-card { transition: transform 0.2s, box-shadow 0.2s; }
        .order-card:active { transform: scale(0.98); }
        input:focus, textarea:focus { border-color: #f472b6 !important; ring: 2px #fbcfe8; }
    </style>
</head>
<body class="pink-gradient min-h-screen pb-24">

    <div id="global-loader" class="fixed inset-0 bg-white z-[200] flex flex-col items-center justify-center">
        <div class="w-12 h-12 border-4 border-pink-100 border-t-pink-500 rounded-full animate-spin mb-4"></div>
        <p class="text-pink-500 font-semibold italic">שירן קייקס - מיד מתחילים...</p>
    </div>

    <div id="login-screen" class="hidden flex flex-col items-center justify-center min-h-screen p-6">
        <div class="bg-white/90 backdrop-blur-xl p-10 rounded-[3rem] shadow-2xl flex flex-col items-center w-full max-w-sm border border-white">
            <div class="w-24 h-24 bg-pink-100 rounded-full flex items-center justify-center text-5xl mb-6 shadow-inner">🧁</div>
            <h1 class="text-3xl font-bold text-slate-800 mb-1">שירן קייקס</h1>
            <p class="text-slate-400 mb-8 text-sm italic text-center">הופכת כל רגע למתוק יותר</p>
            <button onclick="login()" class="w-full flex items-center justify-center gap-3 bg-slate-900 text-white py-4 rounded-2xl font-bold shadow-xl hover:bg-slate-800 active:scale-95 transition-all">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google/lightweight/icon-google.svg" class="w-6 h-6 bg-white rounded-full p-1">
                כניסה למערכת
            </button>
            <p id="login-error" class="text-red-500 text-xs mt-4 text-center"></p>
        </div>
    </div>

    <div id="main-app" class="hidden">
        <header class="bg-white/80 backdrop-blur-md p-5 sticky top-0 z-40 flex justify-between items-center border-b border-pink-100 shadow-sm">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-pink-500 rounded-2xl flex items-center justify-center text-white font-bold shadow-lg rotate-3">ש</div>
                <span id="user-name" class="font-bold text-slate-700"></span>
            </div>
            <button onclick="logout()" class="text-slate-300 hover:text-pink-500 transition-colors">
                <i data-lucide="log-out" class="w-6 h-6"></i>
            </button>
        </header>

        <main class="p-5 max-w-md mx-auto">
            <div id="orders-list" class="space-y-4"></div>
        </main>

        <!-- Floating Action Button -->
        <div class="fixed bottom-8 left-0 right-0 flex justify-center pointer-events-none z-50">
            <button onclick="openModal()" class="w-16 h-16 bg-pink-500 text-white rounded-full shadow-2xl shadow-pink-300 flex items-center justify-center active:scale-90 transition-all pointer-events-auto border-4 border-white">
                <i data-lucide="plus" class="w-8 h-8"></i>
            </button>
        </div>
    </div>

    <!-- Modal -->
    <div id="modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-lg rounded-[2.5rem] overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
            <div class="p-6 bg-pink-50 flex justify-between items-center border-b border-pink-100">
                <h2 class="text-xl font-bold text-pink-700">פרטי הזמנה</h2>
                <button onclick="closeModal()" class="text-pink-300 hover:text-pink-500"><i data-lucide="x-circle"></i></button>
            </div>
            
            <div class="p-6 overflow-y-auto space-y-5">
                <!-- Smart Paste Section -->
                <div class="bg-blue-50 p-4 rounded-2xl border border-blue-100">
                    <p class="text-xs font-bold text-blue-400 mb-2">הדביקי הודעה מהוואטסאפ לזיהוי מהיר:</p>
                    <textarea oninput="analyzePaste(this.value)" placeholder="הדביקי כאן..." class="w-full p-3 text-sm bg-white/50 border border-blue-200 rounded-xl outline-none focus:bg-white resize-none h-16"></textarea>
                </div>

                <form onsubmit="event.preventDefault(); handleNewOrder();" class="space-y-4">
                    <div class="grid grid-cols-2 gap-3">
                        <div class="col-span-2">
                            <label class="block text-xs font-bold text-slate-400 mb-1 mr-2">שם לקוחה</label>
                            <input type="text" id="cust-name" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none" required>
                        </div>
                        <div class="col-span-2">
                            <label class="block text-xs font-bold text-slate-400 mb-1 mr-2">תאריך איסוף</label>
                            <input type="date" id="cust-date" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none" required>
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-1 mr-2">תיאור ופרטים</label>
                        <textarea id="cust-desc" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none h-32"></textarea>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-1 mr-2">תמונה/השראה (URL)</label>
                        <input type="text" id="cust-img" placeholder="הדביקי קישור לתמונה במידה ויש" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none text-sm">
                    </div>

                    <button type="submit" id="save-btn" class="w-full bg-pink-500 text-white py-4 rounded-2xl font-bold shadow-lg shadow-pink-100 active:scale-95 transition-all mt-4">שמירת הזמנה ✨</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        function openModal() { document.getElementById('modal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('modal').classList.add('hidden'); }

        function render(orders) {
            const list = document.getElementById('orders-list');
            if (orders.length === 0) {
                list.innerHTML = `<div class="text-center py-20 opacity-30 font-bold"><p>אין הזמנות כרגע...</p></div>`;
                lucide.createIcons();
                return;
            }

            const sorted = orders.sort((a,b) => new Date(a.date) - new Date(b.date));
            
            list.innerHTML = sorted.map(o => {
                const date = new Date(o.date);
                const isToday = new Date().toDateString() === date.toDateString();
                
                return `
                <div class="order-card bg-white rounded-[2rem] shadow-sm border border-pink-50 overflow-hidden relative">
                    ${o.image ? `<img src="${o.image}" class="w-full h-40 object-cover opacity-90" onerror="this.style.display='none'">` : ''}
                    <div class="p-5">
                        <div class="flex justify-between items-start mb-3">
                            <div class="text-left flex gap-2">
                                <button onclick="window.deleteOrder('${o.id}')" class="w-8 h-8 rounded-full bg-slate-50 flex items-center justify-center text-slate-300 hover:text-red-500 transition-colors">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                </button>
                            </div>
                            <div class="text-right">
                                <h3 class="font-bold text-slate-800 text-lg leading-tight">${o.name}</h3>
                                <div class="flex items-center gap-1 justify-end mt-1 ${isToday ? 'text-green-500 animate-pulse' : 'text-pink-500'} font-bold text-sm">
                                    <span>${o.date.split('-').reverse().join('/')}</span>
                                    <i data-lucide="calendar" class="w-3 h-3"></i>
                                </div>
                            </div>
                        </div>
                        <div class="bg-slate-50/50 p-4 rounded-2xl text-slate-600 text-sm whitespace-pre-wrap leading-relaxed border border-slate-50 italic">
                            ${o.details || 'ללא פירוט'}
                        </div>
                    </div>
                </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        async function handleNewOrder() {
            const btn = document.getElementById('save-btn');
            const originalText = btn.innerText;
            btn.disabled = true;
            btn.innerHTML = 'שומר...';
            
            const data = {
                id: Date.now().toString(),
                name: document.getElementById('cust-name').value,
                date: document.getElementById('cust-date').value,
                details: document.getElementById('cust-desc').value,
                image: document.getElementById('cust-img').value,
                createdAt: new Date().toISOString()
            };
            
            try {
                await window.saveOrder(data);
                closeModal();
                document.querySelector('form').reset();
                document.querySelectorAll('textarea').forEach(t => t.value = "");
            } catch (e) {
                alert("תקלה בשמירה: " + e.message);
            } finally {
                btn.disabled = false;
                btn.innerText = originalText;
            }
        }
        
        lucide.createIcons();
    </script>
</body>
</html>

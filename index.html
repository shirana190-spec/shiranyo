<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ניהול הזמנות - שירן</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700&display=swap');
        body { font-family: 'Assistant', sans-serif; -webkit-tap-highlight-color: transparent; }
        .modal-animate { animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-20">

    <!-- Header -->
    <header class="bg-pink-600 text-white p-4 shadow-lg sticky top-0 z-40 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <i data-lucide="cake"></i>
            <div>
                <h1 class="text-lg font-bold">הזמנות שירן</h1>
                <span id="status-badge" class="text-[10px] bg-white/20 px-2 py-0.5 rounded-full">מצב מקומי</span>
            </div>
        </div>
        <div class="flex gap-3">
            <button onclick="openModal('import')" class="p-2 bg-white/10 rounded-full active:scale-90 transition-transform">
                <i data-lucide="wand-2" class="w-5 h-5"></i>
            </button>
            <button onclick="openModal('form')" class="p-2 bg-white rounded-full text-pink-600 shadow-md active:scale-90 transition-transform">
                <i data-lucide="plus" class="w-6 h-6"></i>
            </button>
        </div>
    </header>

    <!-- Content -->
    <main id="orders-list" class="p-4 max-w-xl mx-auto space-y-4">
        <!-- Orders will be injected here -->
    </main>

    <!-- Modal Container -->
    <div id="modal-overlay" class="fixed inset-0 bg-black/50 z-50 hidden backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div id="modal-content" class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-2xl shadow-2xl overflow-hidden modal-animate">
            <div class="p-4 border-b flex justify-between items-center bg-slate-50">
                <h2 id="modal-title" class="font-bold text-slate-800">הזמנה חדשה</h2>
                <button onclick="closeModal()" class="p-2 text-slate-400"><i data-lucide="x"></i></button>
            </div>
            
            <div class="p-6 max-h-[80vh] overflow-y-auto">
                <!-- Import Mode -->
                <div id="view-import" class="space-y-4">
                    <p class="text-sm text-slate-500">הדביקי את סיכום ההזמנה מהווטסאפ:</p>
                    <textarea id="import-text" class="w-full h-40 p-4 border rounded-xl text-sm focus:ring-2 focus:ring-pink-500 outline-none" placeholder="הדביקי כאן..."></textarea>
                    <button onclick="processImport()" class="w-full bg-pink-600 text-white py-4 rounded-xl font-bold shadow-lg active:bg-pink-700">חלצי נתונים</button>
                </div>

                <!-- Manual/Edit Mode -->
                <form id="order-form" onsubmit="handleSave(event)" class="hidden space-y-4">
                    <div class="grid grid-cols-2 gap-3">
                        <div class="col-span-2">
                            <label class="text-xs font-bold text-slate-400 block mb-1">שם לקוחה</label>
                            <input type="text" id="f-name" required class="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:border-pink-400">
                        </div>
                        <div>
                            <label class="text-xs font-bold text-slate-400 block mb-1">תאריך</label>
                            <input type="date" id="f-date" required class="w-full p-3 bg-slate-50 border rounded-xl outline-none">
                        </div>
                        <div>
                            <label class="text-xs font-bold text-slate-400 block mb-1">מחיר ₪</label>
                            <input type="number" id="f-price" class="w-full p-3 bg-slate-50 border rounded-xl outline-none">
                        </div>
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-400 block mb-1">זמן איסוף</label>
                        <select id="f-time" class="w-full p-3 bg-slate-50 border rounded-xl outline-none">
                            <option value="בוקר">בוקר</option>
                            <option value="צהריים">צהריים</option>
                            <option value="ערב">ערב</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-400 block mb-1">פרטי העוגה</label>
                        <textarea id="f-details" rows="3" class="w-full p-3 bg-slate-50 border rounded-xl outline-none"></textarea>
                    </div>
                    <div class="bg-red-50 p-3 rounded-xl border border-red-100">
                        <label class="text-xs font-bold text-red-400 block mb-1">אלרגנים / הערות דחופות</label>
                        <input type="text" id="f-notes" class="w-full bg-transparent border-none outline-none text-red-700 font-bold placeholder:text-red-200" placeholder="אין">
                    </div>
                    <button type="submit" class="w-full bg-pink-600 text-white py-4 rounded-xl font-bold shadow-lg">שמירה</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // State
        let orders = JSON.parse(localStorage.getItem('shiran_orders') || '[]');
        let currentEditId = null;

        // Render UI
        function render() {
            const container = document.getElementById('orders-list');
            if (orders.length === 0) {
                container.innerHTML = `<div class="text-center py-20 text-slate-300"><i data-lucide="cake" class="w-12 h-12 mx-auto mb-2 opacity-20"></i><p>אין הזמנות כרגע</p></div>`;
            } else {
                // Sort by date
                const sorted = [...orders].sort((a, b) => new Date(a.date) - new Date(b.date));
                container.innerHTML = sorted.map(o => `
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                        <div class="p-4 flex items-center justify-between" onclick="toggleDetails('${o.id}')">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 bg-pink-50 rounded-full flex items-center justify-center text-pink-500">
                                    <i data-lucide="calendar"></i>
                                </div>
                                <div>
                                    <h3 class="font-bold text-slate-800">${o.name}</h3>
                                    <p class="text-xs text-pink-500 font-bold">${o.date.split('-').reverse().join('/')} | ${o.time}</p>
                                </div>
                            </div>
                            <div class="text-left">
                                <div class="font-bold text-slate-700 text-lg">₪${o.price || 0}</div>
                                <i data-lucide="chevron-down" id="icon-${o.id}" class="w-4 h-4 text-slate-300 transition-transform"></i>
                            </div>
                        </div>
                        <div id="details-${o.id}" class="hidden px-4 pb-4 space-y-3 border-t border-slate-50 pt-3">
                            ${o.notes ? `<div class="bg-red-50 p-2 rounded-lg text-red-600 text-xs font-bold flex items-center gap-2"><i data-lucide="alert-circle" class="w-3 h-3"></i> ${o.notes}</div>` : ''}
                            <div class="text-sm text-slate-600 bg-slate-50 p-3 rounded-xl whitespace-pre-wrap">${o.details || 'אין פירוט נוסף'}</div>
                            <div class="flex gap-2">
                                <button onclick="editOrder('${o.id}')" class="flex-1 py-2 bg-slate-100 text-slate-600 rounded-lg text-xs font-bold">עריכה</button>
                                <button onclick="deleteOrder('${o.id}')" class="px-4 py-2 text-red-400 rounded-lg text-xs"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                            </div>
                        </div>
                    </div>
                `).join('');
            }
            lucide.createIcons();
            localStorage.setItem('shiran_orders', JSON.stringify(orders));
        }

        // Logic
        window.toggleDetails = (id) => {
            const d = document.getElementById(`details-${id}`);
            const i = document.getElementById(`icon-${id}`);
            d.classList.toggle('hidden');
            i.classList.toggle('rotate-180');
        };

        window.openModal = (mode) => {
            document.getElementById('modal-overlay').classList.remove('hidden');
            if (mode === 'import') {
                document.getElementById('view-import').classList.remove('hidden');
                document.getElementById('order-form').classList.add('hidden');
                document.getElementById('modal-title').innerText = "ייבוא מהודעה";
            } else {
                document.getElementById('view-import').classList.add('hidden');
                document.getElementById('order-form').classList.remove('hidden');
                document.getElementById('modal-title').innerText = currentEditId ? "עריכת הזמנה" : "הזמנה ידנית";
            }
        };

        window.closeModal = () => {
            document.getElementById('modal-overlay').classList.add('hidden');
            document.getElementById('order-form').reset();
            currentEditId = null;
        };

        window.processImport = () => {
            const text = document.getElementById('import-text').value;
            if (!text) return;

            // Simple parser
            const name = text.split('\n')[0].split(':')[0].replace(/[🎂*]/g, '').trim();
            const price = text.match(/(\d+)/)?.[0] || "";
            const dateMatch = text.match(/(\d{1,2}\/\d{1,2}\/\d{4})/);
            let date = "";
            if (dateMatch) {
                const [d, m, y] = dateMatch[1].split('/');
                date = `${y}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`;
            }

            document.getElementById('f-name').value = name;
            document.getElementById('f-price').value = price;
            document.getElementById('f-date').value = date;
            document.getElementById('f-details').value = text;
            
            document.getElementById('view-import').classList.add('hidden');
            document.getElementById('order-form').classList.remove('hidden');
        };

        window.handleSave = (e) => {
            e.preventDefault();
            const data = {
                id: currentEditId || Date.now().toString(),
                name: document.getElementById('f-name').value,
                date: document.getElementById('f-date').value,
                price: document.getElementById('f-price').value,
                time: document.getElementById('f-time').value,
                details: document.getElementById('f-details').value,
                notes: document.getElementById('f-notes').value,
            };

            if (currentEditId) {
                orders = orders.map(o => o.id === currentEditId ? data : o);
            } else {
                orders.push(data);
            }

            closeModal();
            render();
        };

        window.editOrder = (id) => {
            const o = orders.find(x => x.id === id);
            currentEditId = id;
            document.getElementById('f-name').value = o.name;
            document.getElementById('f-date').value = o.date;
            document.getElementById('f-price').value = o.price;
            document.getElementById('f-time').value = o.time;
            document.getElementById('f-details').value = o.details;
            document.getElementById('f-notes').value = o.notes;
            openModal('form');
        };

        window.deleteOrder = (id) => {
            if (confirm("למחוק הזמנה?")) {
                orders = orders.filter(o => o.id !== id);
                render();
            }
        };

        // Start
        render();
    </script>
</body>
</html>

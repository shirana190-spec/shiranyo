<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>שירן קייקס - ניהול חכם</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getAuth, signInWithRedirect, getRedirectResult, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAY2rawG2ChvPoC7zZyITFl0KEew8xddSQ",
            authDomain: "shiran-cakes.firebaseapp.com",
            projectId: "shiran-cakes",
            storageBucket: "shiran-cakes.firebasestorage.app",
            messagingSenderId: "838335385748",
            appId: "1:838335385748:web:ee2af1554ae38900d3e481"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();
        const appId = 'shiran-cakes-v1';

        // Fix for the popup-blocked error on mobile
        getRedirectResult(auth).catch(err => console.error("Auth redirect error:", err));

        onAuthStateChanged(auth, (user) => {
            const loader = document.getElementById('global-loader');
            const loginScreen = document.getElementById('login-screen');
            const mainApp = document.getElementById('main-app');
            
            if (user) {
                document.getElementById('user-name').innerText = "היי " + user.displayName.split(' ')[0] + " ✨";
                listenToOrders(user.uid);
                loader.classList.add('hidden');
                loginScreen.classList.add('hidden');
                mainApp.classList.remove('hidden');
            } else {
                loader.classList.add('hidden');
                loginScreen.classList.remove('hidden');
                mainApp.classList.add('hidden');
            }
        });

        window.login = () => signInWithRedirect(auth, provider);
        window.logout = () => { if(confirm("להתנתק?")) signOut(auth); };

        function listenToOrders(uid) {
            const q = collection(db, 'artifacts', appId, 'users', uid, 'orders');
            onSnapshot(q, (snapshot) => {
                const orders = snapshot.docs.map(doc => ({ ...doc.data(), id: doc.id }));
                render(orders);
            });
        }

        window.saveOrder = async (data) => {
            const user = auth.currentUser;
            if (!user) return;
            const ref = doc(db, 'artifacts', appId, 'users', user.uid, 'orders', data.id);
            await setDoc(ref, data);
        };

        window.deleteOrder = async (id) => {
            if (confirm("למחוק את ההזמנה?")) {
                const user = auth.currentUser;
                await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'orders', id));
            }
        };

        // Smart Parsing for the specific format: "Name : Content"
        window.analyzePaste = (text) => {
            // Priority 1: Match "Name : " at the start
            const startMatch = text.match(/^([^:\n]+)\s*:/);
            // Priority 2: Match "שם: Name"
            const labelMatch = text.match(/(?:שם|לקוחה?)[:\s-]\s*([א-ת\s]+)/);
            
            const name = (startMatch ? startMatch[1] : (labelMatch ? labelMatch[1] : "")).trim();
            if (name) document.getElementById('cust-name').value = name;

            const dateMatch = text.match(/(\d{1,2}[\/.]\d{1,2}[\/.]\d{2,4})/);
            if (dateMatch) {
                const parts = dateMatch[1].split(/[\/.]/);
                if (parts[2]?.length === 2) parts[2] = "20" + parts[2];
                document.getElementById('cust-date').value = `${parts[2]}-${parts[1].padStart(2,'0')}-${parts[0].padStart(2,'0')}`;
            }
            document.getElementById('cust-desc').value = text;
        };

        // Automatic Image Resizer to prevent "value longer than 1048487 bytes" error
        window.handleImageUpload = (event) => {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800; // Resize to reasonable size
                    let width = img.width;
                    let height = img.height;

                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // Compress to JPEG with 0.7 quality
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
                    window.currentImageData = dataUrl;
                    document.getElementById('img-preview').src = dataUrl;
                    document.getElementById('img-preview-container').classList.remove('hidden');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        };
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap');
        body { font-family: 'Assistant', sans-serif; background: #fff5f8; overflow-x: hidden; }
        .allergy-highlight { background: #fee2e2; color: #dc2626; font-weight: 800; border-radius: 4px; padding: 0 4px; border: 1px solid #fecaca; }
        .pink-btn { background: #ec4899; box-shadow: 0 4px 14px 0 rgba(236, 72, 153, 0.39); }
    </style>
</head>
<body class="min-h-screen pb-24">

    <div id="global-loader" class="fixed inset-0 bg-white z-[200] flex flex-col items-center justify-center">
        <div class="w-12 h-12 border-4 border-pink-100 border-t-pink-500 rounded-full animate-spin"></div>
    </div>

    <!-- Login Screen -->
    <div id="login-screen" class="hidden flex flex-col items-center justify-center min-h-screen p-6 text-center">
        <div class="bg-white p-10 rounded-[3rem] shadow-xl w-full max-w-xs border border-pink-50">
            <div class="text-6xl mb-6 animate-bounce">🧁</div>
            <h1 class="text-2xl font-bold text-slate-800 mb-2">שירן קייקס</h1>
            <p class="text-slate-400 text-sm mb-8">ניהול הזמנות בקליק</p>
            <button onclick="login()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold flex items-center justify-center gap-3 active:scale-95 transition-transform">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google/lightweight/icon-google.svg" class="w-6">
                כניסה מהירה
            </button>
        </div>
    </div>

    <!-- Main App -->
    <div id="main-app" class="hidden">
        <header class="bg-white/90 backdrop-blur-md p-4 sticky top-0 z-40 border-b border-pink-100 flex justify-between items-center shadow-sm">
            <span id="user-name" class="font-bold text-pink-600 text-lg"></span>
            <button onclick="logout()" class="text-slate-300 p-2"><i data-lucide="log-out"></i></button>
        </header>

        <main class="p-4 space-y-4 max-w-md mx-auto" id="orders-list"></main>

        <div class="fixed bottom-6 left-0 right-0 flex justify-center z-50">
            <button onclick="openModal()" class="pink-btn w-16 h-16 text-white rounded-full flex items-center justify-center border-4 border-white active:scale-90 transition-all">
                <i data-lucide="plus" class="w-8 h-8"></i>
            </button>
        </div>
    </div>

    <!-- Modal -->
    <div id="modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[100] hidden flex items-end sm:items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-t-[2.5rem] sm:rounded-[2.5rem] overflow-hidden shadow-2xl flex flex-col max-h-[92vh]">
            <div class="p-6 bg-pink-50 flex justify-between items-center border-b border-pink-100">
                <h2 class="text-xl font-bold text-pink-700">הזמנה חדשה ✨</h2>
                <button onclick="closeModal()" class="text-pink-300"><i data-lucide="x-circle"></i></button>
            </div>
            
            <div class="p-6 overflow-y-auto space-y-4">
                <div class="bg-blue-50 p-4 rounded-2xl">
                    <p class="text-[10px] font-bold text-blue-400 mb-2">הדביקי הודעה כאן לזיהוי אוטומטי:</p>
                    <textarea oninput="analyzePaste(this.value)" placeholder="שם : פרטי הזמנה..." class="w-full p-3 text-sm bg-white/80 border border-blue-100 rounded-xl h-16 outline-none resize-none"></textarea>
                </div>

                <div class="space-y-3">
                    <input type="text" id="cust-name" placeholder="שם הלקוחה" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:border-pink-200">
                    
                    <div class="grid grid-cols-2 gap-2">
                        <input type="date" id="cust-date" class="p-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none">
                        <select id="cust-time" class="p-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none text-sm">
                            <option value="בוקר ☀️">בוקר ☀️</option>
                            <option value="צהריים 🌤️">צהריים 🌤️</option>
                            <option value="ערב 🌙">ערב 🌙</option>
                        </select>
                    </div>
                    
                    <textarea id="cust-desc" placeholder="פירוט, אלרגנים, הערות..." class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none h-32"></textarea>

                    <label class="flex items-center justify-center gap-2 p-4 bg-pink-50 border-2 border-dashed border-pink-200 rounded-2xl text-pink-500 cursor-pointer active:bg-pink-100">
                        <i data-lucide="image" class="w-5 h-5"></i>
                        <span class="text-sm font-bold">הוספת תמונה (יכווץ אוטומטית)</span>
                        <input type="file" accept="image/*" onchange="handleImageUpload(event)" class="hidden">
                    </label>
                    <div id="img-preview-container" class="hidden"><img id="img-preview" class="w-full h-32 object-cover rounded-2xl border-2 border-pink-100"></div>

                    <button onclick="handleNewOrder()" id="save-btn" class="w-full pink-btn text-white py-5 rounded-2xl font-bold text-lg">שמור הזמנה ✨</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function openModal() { document.getElementById('modal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('modal').classList.add('hidden'); }

        function render(orders) {
            const list = document.getElementById('orders-list');
            if (orders.length === 0) {
                list.innerHTML = `<div class="text-center py-20 opacity-20 font-bold"><p>אין הזמנות ברשימה</p></div>`;
                return;
            }

            const sorted = orders.sort((a,b) => new Date(a.date) - new Date(b.date));
            list.innerHTML = sorted.map(o => {
                const dateDisp = o.date ? o.date.split('-').reverse().join('/') : 'ללא תאריך';
                
                // Highlight rows containing "אלרגנים" or "בוטנים" etc.
                const formattedDetails = (o.details || '')
                    .split('\n')
                    .map(line => {
                        if (line.includes('אלרגנים') || line.includes('בוטנים') || line.includes('רגישות')) {
                            return `<span class="allergy-highlight">${line}</span>`;
                        }
                        return line;
                    })
                    .join('<br>');

                return `
                <div class="bg-white rounded-[2rem] shadow-sm border border-pink-50 overflow-hidden">
                    ${o.image ? `<img src="${o.image}" class="w-full h-48 object-cover">` : ''}
                    <div class="p-5">
                        <div class="flex justify-between items-start mb-3">
                            <div class="text-right">
                                <h3 class="font-bold text-slate-800 text-xl">${o.name}</h3>
                                <div class="flex items-center gap-2 mt-1">
                                    <span class="bg-pink-100 text-pink-600 px-3 py-1 rounded-full text-xs font-bold">${o.time}</span>
                                    <span class="text-slate-400 text-xs">${dateDisp}</span>
                                </div>
                            </div>
                            <button onclick="window.deleteOrder('${o.id}')" class="text-slate-200 hover:text-red-400 transition-colors"><i data-lucide="trash-2" class="w-5 h-5"></i></button>
                        </div>
                        <div class="bg-slate-50/50 p-4 rounded-2xl text-slate-600 text-sm leading-relaxed">${formattedDetails}</div>
                    </div>
                </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        async function handleNewOrder() {
            const btn = document.getElementById('save-btn');
            btn.disabled = true;
            btn.innerText = 'שומר במערכת...';
            
            const data = {
                id: Date.now().toString(),
                name: document.getElementById('cust-name').value || 'לקוחה ללא שם',
                date: document.getElementById('cust-date').value,
                time: document.getElementById('cust-time').value,
                details: document.getElementById('cust-desc').value,
                image: window.currentImageData || null,
                createdAt: new Date().toISOString()
            };
            
            try {
                await window.saveOrder(data);
                closeModal();
                // Clear form
                document.getElementById('cust-name').value = '';
                document.getElementById('cust-date').value = '';
                document.getElementById('cust-desc').value = '';
                window.currentImageData = null;
                document.getElementById('img-preview-container').classList.add('hidden');
            } catch (e) { 
                alert("שגיאה בשמירה: " + e.message); 
            } finally { 
                btn.disabled = false; 
                btn.innerText = 'שמור הזמנה ✨'; 
            }
        }
        lucide.createIcons();
    </script>
</body>
</html>

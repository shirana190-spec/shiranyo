<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ניהול הזמנות - שירן</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, query } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

        // הנתונים ששלחת לי - מוזנים כבר כאן
        const firebaseConfig = {
            apiKey: "AIzaSyAY2rawG2ChvPoC7zZyITFl0KEew8xddSQ",
            authDomain: "shiran-cakes.firebaseapp.com",
            projectId: "shiran-cakes",
            storageBucket: "shiran-cakes.firebasestorage.app",
            messagingSenderId: "838335385748",
            appId: "1:838335385748:web:ee2af1554ae38900d3e481"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'shiran-cakes-v1';

        onAuthStateChanged(auth, (user) => {
            const loader = document.getElementById('global-loader');
            const loginScreen = document.getElementById('login-screen');
            const mainApp = document.getElementById('main-app');
            
            if (user) {
                document.getElementById('user-name').innerText = "שלום, " + user.displayName;
                listenToOrders(user.uid);
                loader.classList.add('hidden');
                loginScreen.classList.add('hidden');
                mainApp.classList.remove('hidden');
            } else {
                loader.classList.add('hidden');
                loginScreen.classList.remove('hidden');
                mainApp.classList.add('hidden');
            }
        });

        window.login = async () => {
            const provider = new GoogleAuthProvider();
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error("Login failed", error);
                alert("התחברות נכשלה. ודאי שהגדרת Authentication ב-Firebase");
            }
        };

        window.logout = () => signOut(auth);

        function listenToOrders(uid) {
            const q = collection(db, 'artifacts', appId, 'users', uid, 'orders');
            onSnapshot(q, (snapshot) => {
                const orders = snapshot.docs.map(doc => ({ ...doc.data(), id: doc.id }));
                render(orders);
            }, (error) => {
                console.error("Snapshot error", error);
            });
        }

        window.saveOrder = async (data) => {
            if (!auth.currentUser) return;
            const ref = doc(db, 'artifacts', appId, 'users', auth.currentUser.uid, 'orders', data.id);
            await setDoc(ref, data);
        };

        window.deleteOrder = async (id) => {
            if (confirm("למחוק הזמנה זו?")) {
                await deleteDoc(doc(db, 'artifacts', appId, 'users', auth.currentUser.uid, 'orders', id));
            }
        };
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@400;700&display=swap');
        body { font-family: 'Assistant', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <div id="global-loader" class="fixed inset-0 bg-white z-[200] flex flex-col items-center justify-center text-pink-500 font-bold">
        <div class="w-12 h-12 border-4 border-pink-200 border-t-pink-500 rounded-full animate-spin mb-4"></div>
        טוען את הענן של שירן...
    </div>

    <div id="login-screen" class="hidden flex flex-col items-center justify-center min-h-screen p-6">
        <div class="bg-white p-8 rounded-3xl shadow-xl flex flex-col items-center max-w-sm w-full">
            <div class="text-6xl mb-4">🎂</div>
            <h1 class="text-2xl font-bold text-pink-600 mb-6 text-center">ניהול הזמנות</h1>
            <button onclick="login()" class="w-full flex items-center justify-center gap-3 bg-white border border-slate-300 py-4 rounded-2xl font-bold shadow-sm active:scale-95 transition-all">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google/lightweight/icon-google.svg" class="w-6 h-6">
                התחברי עם גוגל
            </button>
        </div>
    </div>

    <div id="main-app" class="hidden">
        <header class="bg-white p-4 shadow-sm sticky top-0 z-50 flex justify-between items-center">
            <span id="user-name" class="font-bold text-pink-600"></span>
            <button onclick="logout()" class="text-slate-400 text-xs">התנתקות</button>
        </header>

        <main class="p-4 max-w-lg mx-auto pb-24">
            <div id="orders-list" class="space-y-4"></div>
        </main>

        <button onclick="document.getElementById('modal').classList.remove('hidden')" class="fixed bottom-6 left-6 w-16 h-16 bg-pink-500 text-white rounded-full shadow-2xl flex items-center justify-center text-3xl font-bold active:scale-90 transition-all">+</button>
    </div>

    <div id="modal" class="fixed inset-0 bg-black/50 z-[100] hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-3xl p-6">
            <h2 class="text-xl font-bold mb-4 text-right">הזמנה חדשה</h2>
            <form onsubmit="event.preventDefault(); handleNewOrder();" class="space-y-4 text-right">
                <input type="text" id="cust-name" placeholder="שם הלקוחה" class="w-full p-4 bg-slate-100 rounded-2xl outline-none" required>
                <input type="date" id="cust-date" class="w-full p-4 bg-slate-100 rounded-2xl outline-none" required>
                <textarea id="cust-desc" placeholder="מה היא הזמינה?" class="w-full p-4 bg-slate-100 rounded-2xl outline-none" rows="3"></textarea>
                <div class="flex gap-2">
                    <button type="submit" id="save-btn" class="flex-1 bg-pink-500 text-white py-4 rounded-2xl font-bold">שמירה</button>
                    <button type="button" onclick="document.getElementById('modal').classList.add('hidden')" class="px-6 py-4 bg-slate-100 rounded-2xl text-slate-500">ביטול</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function render(orders) {
            const list = document.getElementById('orders-list');
            if (orders.length === 0) {
                list.innerHTML = '<div class="text-center py-20 text-slate-400">אין עדיין הזמנות. לחצי על הפלוס!</div>';
                return;
            }
            list.innerHTML = orders.sort((a,b) => new Date(a.date) - new Date(b.date)).map(o => `
                <div class="bg-white p-5 rounded-2xl shadow-sm border-r-4 border-pink-500 text-right relative">
                    <div class="font-bold text-lg">${o.name}</div>
                    <div class="text-pink-500 font-bold text-sm">${o.date.split('-').reverse().join('/')}</div>
                    <div class="mt-2 text-slate-600 text-sm whitespace-pre-wrap">${o.details || ''}</div>
                    <button onclick="window.deleteOrder('${o.id}')" class="absolute left-4 top-4 text-slate-200 hover:text-red-500">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                </div>
            `).join('');
            lucide.createIcons();
        }

        async function handleNewOrder() {
            const btn = document.getElementById('save-btn');
            btn.disabled = true;
            btn.innerText = "שומר...";
            
            const data = {
                id: Date.now().toString(),
                name: document.getElementById('cust-name').value,
                date: document.getElementById('cust-date').value,
                details: document.getElementById('cust-desc').value,
                createdAt: new Date().toISOString()
            };
            
            await window.saveOrder(data);
            
            btn.disabled = false;
            btn.innerText = "שמירה";
            document.getElementById('modal').classList.add('hidden');
            document.querySelector('form').reset();
        }
    </script>
</body>
</html>

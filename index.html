<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ניהול הזמנות - שירן (מסונכרן לענן)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js" type="module"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js" type="module"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js" type="module"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700&display=swap');
        body { font-family: 'Assistant', sans-serif; -webkit-tap-highlight-color: transparent; }
        .modal-animate { animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .thumbnail-scroll::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-20">

    <!-- Header -->
    <header class="bg-pink-600 text-white p-4 shadow-lg sticky top-0 z-40 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <i data-lucide="cloud-check" id="cloud-icon" class="text-pink-200"></i>
            <div>
                <h1 class="text-lg font-bold">הזמנות שירן</h1>
                <span id="sync-status" class="text-[10px] bg-white/20 px-2 py-0.5 rounded-full font-medium">מתחבר לענן...</span>
            </div>
        </div>
        <div class="flex gap-3">
            <button onclick="openModal('import')" class="p-2 bg-white/10 rounded-full active:scale-90 transition-transform">
                <i data-lucide="wand-2" class="w-5 h-5"></i>
            </button>
            <button onclick="openModal('form')" class="p-2 bg-white rounded-full text-pink-600 shadow-md active:scale-90 transition-transform">
                <i data-lucide="plus" class="w-6 h-6"></i>
            </button>
        </div>
    </header>

    <!-- Main List -->
    <main id="orders-list" class="p-4 max-w-xl mx-auto space-y-4">
        <div class="flex flex-col items-center justify-center py-20 text-slate-400">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-pink-500 mb-4"></div>
            <p>טוען נתונים מהענן...</p>
        </div>
    </main>

    <!-- Modal Container (Remains mostly same as before, with image upload) -->
    <div id="modal-overlay" class="fixed inset-0 bg-black/50 z-50 hidden backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div id="modal-content" class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-2xl shadow-2xl overflow-hidden modal-animate">
            <div class="p-4 border-b flex justify-between items-center bg-slate-50">
                <h2 id="modal-title" class="font-bold text-slate-800">הזמנה חדשה</h2>
                <button onclick="closeModal()" class="p-2 text-slate-400"><i data-lucide="x"></i></button>
            </div>
            
            <div class="p-6 max-h-[80vh] overflow-y-auto">
                <div id="view-import" class="space-y-4">
                    <p class="text-sm text-slate-500">הדביקי את סיכום ההזמנה מהווטסאפ:</p>
                    <textarea id="import-text" class="w-full h-40 p-4 border rounded-xl text-sm outline-none" placeholder="הדביקי כאן..."></textarea>
                    <button onclick="processImport()" class="w-full bg-pink-600 text-white py-4 rounded-xl font-bold shadow-lg">חלצי נתונים</button>
                </div>

                <form id="order-form" onsubmit="handleSave(event)" class="hidden space-y-4">
                    <div id="image-upload-container" class="grid grid-cols-3 gap-2 mb-4">
                        <!-- Slots managed by JS -->
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div class="col-span-2">
                            <label class="text-xs font-bold text-slate-400 block mb-1">שם לקוחה</label>
                            <input type="text" id="f-name" required class="w-full p-3 bg-slate-50 border rounded-xl outline-none">
                        </div>
                        <div>
                            <label class="text-xs font-bold text-slate-400 block mb-1">תאריך</label>
                            <input type="date" id="f-date" required class="w-full p-3 bg-slate-50 border rounded-xl outline-none">
                        </div>
                        <div>
                            <label class="text-xs font-bold text-slate-400 block mb-1">מחיר ₪</label>
                            <input type="number" id="f-price" class="w-full p-3 bg-slate-50 border rounded-xl outline-none">
                        </div>
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-400 block mb-1">זמן איסוף</label>
                        <select id="f-time" class="w-full p-3 bg-slate-50 border rounded-xl outline-none">
                            <option value="בוקר">בוקר</option>
                            <option value="צהריים">צהריים</option>
                            <option value="ערב">ערב</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-400 block mb-1">פרטי העוגה</label>
                        <textarea id="f-details" rows="3" class="w-full p-3 bg-slate-50 border rounded-xl outline-none"></textarea>
                    </div>
                    <div class="bg-red-50 p-3 rounded-xl border border-red-100">
                        <label class="text-xs font-bold text-red-400 block mb-1">אלרגנים / הערות דחופות</label>
                        <input type="text" id="f-notes" class="w-full bg-transparent border-none outline-none text-red-700 font-bold" placeholder="אין">
                    </div>
                    <button type="submit" id="save-btn" class="w-full bg-pink-600 text-white py-4 rounded-xl font-bold shadow-lg">שמירה לענן</button>
                </form>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Configuration (Environment provided)
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'shiran-cakes';

        let orders = [];
        let currentUser = null;
        let currentImages = [];
        let currentEditId = null;

        // Initialize Auth
        const init = async () => {
            try {
                await signInAnonymously(auth);
            } catch (e) {
                console.error("Auth failed, using local mode");
                updateSyncStatus("מצב לא מקוון");
            }
        };

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                updateSyncStatus("מחובר לענן");
                listenToOrders();
            }
        });

        const updateSyncStatus = (text) => {
            document.getElementById('sync-status').innerText = text;
            const icon = document.getElementById('cloud-icon');
            if (text.includes("ענן")) {
                icon.innerHTML = '<i data-lucide="cloud-check"></i>';
                icon.className = "text-green-300";
            } else {
                icon.innerHTML = '<i data-lucide="cloud-off"></i>';
                icon.className = "text-red-300";
            }
            lucide.createIcons();
        };

        // Listen for live updates
        const listenToOrders = () => {
            if (!currentUser) return;
            const ordersRef = collection(db, 'artifacts', appId, 'users', currentUser.uid, 'orders');
            onSnapshot(ordersRef, (snapshot) => {
                orders = snapshot.docs.map(doc => ({ ...doc.data(), id: doc.id }));
                render();
            }, (error) => {
                console.error("Snapshot error:", error);
                updateSyncStatus("שגיאת סנכרון");
            });
        };

        // Render UI
        window.render = () => {
            const container = document.getElementById('orders-list');
            if (orders.length === 0) {
                container.innerHTML = `<div class="text-center py-20 text-slate-300"><i data-lucide="cake" class="w-12 h-12 mx-auto mb-2 opacity-20"></i><p>אין הזמנות בענן</p></div>`;
            } else {
                const sorted = [...orders].sort((a, b) => new Date(a.date) - new Date(b.date));
                container.innerHTML = sorted.map(o => `
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                        <div class="p-4 flex items-center justify-between" onclick="toggleDetails('${o.id}')">
                            <div class="flex items-center gap-3">
                                <div class="w-12 h-12 bg-pink-50 rounded-xl flex items-center justify-center overflow-hidden border">
                                    ${o.images && o.images[0] ? `<img src="${o.images[0]}" class="w-full h-full object-cover">` : `<i data-lucide="image" class="w-5 h-5 opacity-30 text-pink-500"></i>`}
                                </div>
                                <div>
                                    <h3 class="font-bold text-slate-800">${o.name}</h3>
                                    <p class="text-[11px] text-pink-500 font-bold">${o.date.split('-').reverse().join('/')} | ${o.time}</p>
                                </div>
                            </div>
                            <div class="font-bold text-slate-700">₪${o.price || 0}</div>
                        </div>
                        <div id="details-${o.id}" class="hidden px-4 pb-4 space-y-3 border-t border-slate-50 pt-3">
                            <div class="flex gap-2 overflow-x-auto thumbnail-scroll">
                                ${o.images ? o.images.map(img => `<img src="${img}" class="h-32 rounded-lg border">`).join('') : ''}
                            </div>
                            <div class="text-sm text-slate-600 bg-slate-50 p-3 rounded-xl whitespace-pre-wrap">${o.details}</div>
                            <div class="flex gap-2">
                                <button onclick="editOrder('${o.id}')" class="flex-1 py-3 bg-slate-100 rounded-xl text-xs font-bold">עריכה</button>
                                <button onclick="deleteOrder('${o.id}')" class="px-4 py-3 text-red-400 rounded-xl"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                            </div>
                        </div>
                    </div>
                `).join('');
            }
            lucide.createIcons();
        };

        // Actions
        window.handleSave = async (e) => {
            e.preventDefault();
            if (!currentUser) { alert("ממתין לחיבור ענן..."); return; }
            
            const btn = document.getElementById('save-btn');
            btn.disabled = true;
            btn.innerText = "שומר לענן...";

            const id = currentEditId || Date.now().toString();
            const orderData = {
                name: document.getElementById('f-name').value,
                date: document.getElementById('f-date').value,
                price: document.getElementById('f-price').value,
                time: document.getElementById('f-time').value,
                details: document.getElementById('f-details').value,
                notes: document.getElementById('f-notes').value,
                images: currentImages,
                updatedAt: Date.now()
            };

            try {
                await setDoc(doc(db, 'artifacts', appId, 'users', currentUser.uid, 'orders', id), orderData);
                closeModal();
            } catch (err) {
                alert("שגיאה בשמירה לענן");
            } finally {
                btn.disabled = false;
                btn.innerText = "שמירה לענן";
            }
        };

        window.deleteOrder = async (id) => {
            if (confirm("למחוק מהענן לצמיתות?")) {
                await deleteDoc(doc(db, 'artifacts', appId, 'users', currentUser.uid, 'orders', id));
            }
        };

        // Helper: Image Handling
        window.initImageSlots = () => {
            const container = document.getElementById('image-upload-container');
            container.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                const div = document.createElement('div');
                div.className = "relative aspect-square bg-slate-100 rounded-xl border-2 border-dashed border-slate-200 flex items-center justify-center overflow-hidden";
                if (currentImages[i]) {
                    div.innerHTML = `<img src="${currentImages[i]}" class="w-full h-full object-cover">
                                     <button onclick="removeImg(${i})" class="absolute top-0 right-0 bg-red-500 text-white p-1 rounded-bl-lg"><i data-lucide="x" class="w-3 h-3"></i></button>`;
                } else {
                    div.innerHTML = `<label class="w-full h-full flex items-center justify-center cursor-pointer">
                                        <i data-lucide="image-plus" class="text-slate-300"></i>
                                        <input type="file" class="hidden" onchange="uploadImg(this)">
                                     </label>`;
                }
                container.appendChild(div);
            }
            lucide.createIcons();
        };

        window.uploadImg = (input) => {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    currentImages.push(e.target.result);
                    initImageSlots();
                };
                reader.readAsDataURL(file);
            }
        };

        window.removeImg = (i) => {
            currentImages.splice(i, 1);
            initImageSlots();
        };

        // UI Helpers
        window.toggleDetails = (id) => document.getElementById(`details-${id}`).classList.toggle('hidden');
        window.closeModal = () => {
            document.getElementById('modal-overlay').classList.add('hidden');
            document.getElementById('order-form').reset();
            currentImages = [];
            currentEditId = null;
        };
        window.openModal = (mode) => {
            document.getElementById('modal-overlay').classList.remove('hidden');
            if (mode === 'import') {
                document.getElementById('view-import').classList.remove('hidden');
                document.getElementById('order-form').classList.add('hidden');
            } else {
                document.getElementById('view-import').classList.add('hidden');
                document.getElementById('order-form').classList.remove('hidden');
                initImageSlots();
            }
        };

        window.editOrder = (id) => {
            const o = orders.find(x => x.id === id);
            currentEditId = id;
            document.getElementById('f-name').value = o.name;
            document.getElementById('f-date').value = o.date;
            document.getElementById('f-price').value = o.price;
            document.getElementById('f-time').value = o.time;
            document.getElementById('f-details').value = o.details;
            document.getElementById('f-notes').value = o.notes;
            currentImages = o.images || [];
            openModal('form');
        };

        window.processImport = () => {
            const text = document.getElementById('import-text').value;
            const name = text.split('\n')[0].split(':')[0].replace(/[🎂*]/g, '').trim();
            document.getElementById('f-name').value = name;
            document.getElementById('f-details').value = text;
            document.getElementById('view-import').classList.add('hidden');
            document.getElementById('order-form').classList.remove('hidden');
            initImageSlots();
        };

        init();
    </script>
</body>
</html>
